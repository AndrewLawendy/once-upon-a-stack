<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Once Upon a Stack</title>
<style>
{{FONTS}}
:root{--wall:#2E8B7F;--wood:#7A4A2B;--wood-top:#A9713F;--ink:#F7FBF8;--shadow:rgba(11,31,42,.4)}
@media (prefers-color-scheme:dark){:root{--wall:#141B3F;--wood:#4A2E25;--wood-top:#6A4632}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--wall);color:var(--ink);font:400 1.2rem/1.5 "Alegreya","Palatino Linotype",Palatino,serif;padding:clamp(1.5rem,5vw,4rem) 16px}
h1{max-width:1100px;margin:0 auto 1.5rem;font:400 clamp(2rem,5vw,3.6rem)/1.05 "Bowlby One","Arial Black",sans-serif}
.shelf{max-width:1100px;margin:auto;padding:0 1.2rem;display:flex;flex-wrap:wrap;align-items:flex-end;gap:.5rem;min-height:330px;border-bottom:22px solid var(--wood);box-shadow:0 6px 0 var(--shadow)}
.spine{display:flex;flex-direction:column;justify-content:space-between;width:92px;height:310px;padding:.9rem .4rem;background:var(--bg);color:var(--fg);text-decoration:none;box-shadow:3px 0 0 var(--shadow);clip-path:polygon(4% 1%,97% 0,100% 100%,0 99%);transition:translate .18s ease-out}
.spine:nth-child(even){height:285px}.spine:nth-child(3n){height:325px}
.spine:hover,.spine:focus-visible{translate:0 -10px}
.spine strong{writing-mode:vertical-rl;font:400 1.2rem/1.1 "Bowlby One","Arial Black",sans-serif;align-self:center;max-height:170px;overflow:hidden}
.spine small{display:block;text-align:center;font-size:.92rem;line-height:1.15}
.spine .topic{font-style:italic;overflow-wrap:anywhere}
.empty{font-style:italic}
:focus-visible{outline:3px solid #F6B01E;outline-offset:3px}
@media (prefers-reduced-motion:reduce){.spine{transition:none}}
</style>
</head>
<body>
<h1>Once Upon a Stack</h1>
<div class="shelf">
{{BOOKS}}
</div>
<script>
document.querySelectorAll('[data-written]').forEach(function (el) {
  var days = Math.floor((Date.now() - new Date(el.getAttribute('data-written')).getTime()) / 86400000);
  if (isNaN(days)) return;
  el.textContent = days < 1 ? 'Written today' : days < 60 ? days + (days === 1 ? ' day old' : ' days old') : Math.round(days / 30) + ' months old';
});
</script>
</body>
</html>
